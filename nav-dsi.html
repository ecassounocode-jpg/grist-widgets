<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Navigation — tableau de bord DSI</title>
<!--
  Widget Grist : bandeau de navigation entre les pages du tableau de bord (style Power BI).
  Ville de Roubaix — DSI — Suivi budget & factures CNF

  UTILISATION :
  - Héberger ce fichier à côté de pie-dsi.html (GitHub Pages / GitLab Pages).
  - Dans Grist : Ajouter une vue à la page > Personnalisée > URL de ce fichier.
    Accès requis : « Lire la table sélectionnée » (sert uniquement à détecter
    l'URL du document hôte — aucune donnée n'est lue).
  - Paramètre optionnel dans l'URL : ?active=8 pour surligner la page courante
    (ex. sur la page Synthèse : .../nav-dsi.html?active=8).
  - Hauteur conseillée du widget : ~56 px.
-->
<script>
  // AUCUNE URL codée en dur : le widget détecte tout seul le document Grist qui
  // l'héberge (grist.getAccessToken → origine + id du document). Surcharge possible
  // via ?base=<url encodée du document> si besoin. Nécessite un accès en lecture.
  var QS0 = new URLSearchParams(window.location.search);
  var DOC_BASE = QS0.get("base") || null;
  // N° de la page Reports : varie selon le document (l'id de vue est attribué à la
  // création). Surcharge : ?reports=<n> dans l'URL du widget (défaut 15).
  var REPORTS_PAGE = parseInt(QS0.get("reports") || "15", 10);
  // Onglets additionnels : ?tabs=<page>|<libellé>|<icône emoji>,<page>|<libellé>|<icône>…
  // (icône facultative). Permet d'ajouter des pages sans modifier ce fichier.
  var EXTRA_TABS = (QS0.get("tabs") || "").split(",").filter(Boolean).map(function (t) {
    var p = t.split("|");
    return { p: parseInt(p[0], 10), label: p[1] || ("Page " + p[0]), icon: p[2] || "\uD83D\uDCC4" };
  });
  var PAGES = [
    { p: 8,  label: "Synthèse",          icon: "&#127968;" },
    { p: 9,  label: "Budget",            icon: "&#128202;" },
    { p: 14, label: "Soldes par compte", icon: "&#129518;" },
    { p: 10, label: "Factures",          icon: "&#128182;" },
    { p: 11, label: "Engagements & BC",  icon: "&#128722;" },
    { p: 12, label: "Marchés",           icon: "&#129309;" },
    { p: 13, label: "Fournisseurs",      icon: "&#128666;" }
  ];
  // Reports : masqué si ?reports=0 (module désactivé via la page Configuration)
  if (REPORTS_PAGE > 0) PAGES.push({ p: REPORTS_PAGE, label: "Reports", icon: "&#9193;" });
</script>
<!-- API Grist : indispensable pour l'auto-détection du document hôte -->
<script src="grist-plugin-api.js"></script>
<script>
  if (!window.grist) {
    document.write('<script src="https://docs.getgrist.com/grist-plugin-api.js"><\/script>');
  }
</script>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #ffffff; /* fond page — l'espace sous la barre reste neutre */
    font-family: "Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  #bar {
    display: flex; align-items: stretch;
    height: 48px; /* hauteur FIXE : rendu identique quelle que soit la hauteur du widget */
    background: #252423; /* anthracite Power BI */
    border-radius: 4px;
    padding: 0 8px; gap: 2px; overflow-x: auto; overflow-y: hidden;
  }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 0 14px; cursor: pointer; white-space: nowrap;
    color: #d2d0ce; font-size: 13px; border: none; background: none;
    border-bottom: 3px solid transparent; border-top: 3px solid transparent;
    transition: background .12s, color .12s;
  }
  .tab:hover { background: #3b3a39; color: #ffffff; }
  .tab.active {
    color: #ffffff; font-weight: 600;
    border-bottom-color: #F2C811; /* jaune Power BI */
    background: #323130;
  }
  .tab .ic { font-size: 15px; line-height: 1; }
  #brand {
    display: flex; align-items: center; margin-right: 10px; padding: 0 10px 0 4px;
    color: #F2C811; font-weight: 700; font-size: 13px; letter-spacing: .3px;
    border-right: 1px solid #3b3a39; white-space: nowrap;
  }
  @media (max-width: 640px) { .tab .lb { display: none; } .tab { padding: 0 10px; } }
</style>
</head>
<body>
<nav id="bar" aria-label="Navigation du tableau de bord"></nav>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(window.location.search);
  var active = parseInt(qs.get("active") || "0", 10);

  // Découverte de l'URL du document hôte (une seule fois, mise en cache)
  var lastErr = null;
  function getBase() {
    if (DOC_BASE) return Promise.resolve(DOC_BASE);
    if (!window.grist || !grist.getAccessToken) {
      lastErr = "API Grist absente"; setState("err");
      return Promise.resolve(null);
    }
    var timeout = new Promise(function (res) {
      setTimeout(function () { res({ __timeout: true }); }, 4000);
    });
    return Promise.race([grist.getAccessToken({ readOnly: true }), timeout])
      .then(function (t) {
        if (!t || t.__timeout) { lastErr = "getAccessToken sans réponse (délai)"; setState("err"); return null; }
        var parts = String(t.baseUrl).split("/api/docs/");
        if (parts.length < 2) { lastErr = "baseUrl inattendu : " + t.baseUrl; setState("err"); return null; }
        DOC_BASE = parts[0] + "/" + parts[1].split("/")[0];
        lastErr = null; setState("ok");
        return DOC_BASE;                      // succès mis en cache ; échec jamais
      })
      .catch(function (e) {
        lastErr = "getAccessToken refusé : " + (e && e.message || e); setState("err");
        return null;
      })
      .then(function (b) { return b || fallbackBase(); });
  }
  // Plan B sans jeton d'accès : origine du site hôte via le référent du navigateur
  // + identifiant du document via getDocName (même canal que la lecture des données).
  // Convient aux déploiements mono-organisation (/o/docs/...), c.-à-d. l'auto-hébergement type.
  function fallbackBase() {
    var org = null;
    try { org = document.referrer ? new URL(document.referrer).origin : null; } catch (e) {}
    if (!org || !window.grist || !grist.docApi || !grist.docApi.getDocName) return null;
    return grist.docApi.getDocName().then(function (name) {
      if (!name) return null;
      DOC_BASE = org + "/o/docs/" + name;
      lastErr = null; setState("ok");
      return DOC_BASE;
    }).catch(function (e) {
      lastErr = (lastErr ? lastErr + " ; " : "") + "getDocName refusé : " + (e && e.message || e);
      setState("err");
      return null;
    });
  }
  function setState(st) {
    var dot = document.getElementById("st");
    if (!dot) return;
    dot.style.background = st === "ok" ? "#1AAB40" : "#D13438";
    dot.title = st === "ok" ? "Document hôte détecté" : ("Navigation indisponible — " + (lastErr || "cause inconnue"));
    if (lastErr) { try { console.warn("nav-dsi:", lastErr); } catch (e) {} }
  }
  if (window.grist) { try { grist.ready({ requiredAccess: "read table" }); } catch (e) {} }

  var bar = document.getElementById("bar");
  var brand = document.createElement("div");
  brand.id = "brand";
  // Marque : ?titre=<texte> sinon "BUDGET DSI <?annee= ou année courante>" — rien en dur.
  var AN0 = parseInt(QS0.get("annee") || "0", 10) || (new Date()).getFullYear();
  brand.textContent = QS0.get("titre") || ("BUDGET DSI " + AN0);
  var dot = document.createElement("span");
  dot.id = "st";
  dot.style.cssText = "width:7px;height:7px;border-radius:50%;margin-left:8px;background:#605E5C;flex:0 0 auto;align-self:center;";
  brand.appendChild(dot);
  bar.appendChild(brand);

  EXTRA_TABS.forEach(function (t) { PAGES.push(t); });
  PAGES.forEach(function (pg) {
    var b = document.createElement("button");
    b.className = "tab" + (pg.p === active ? " active" : "");
    b.innerHTML = '<span class="ic">' + pg.icon + '</span><span class="lb">' + pg.label + '</span>';
    b.title = pg.label;
    b.addEventListener("click", function () {
      getBase().then(function (b0) {
        if (!b0) return; // document hôte inconnu : on ne navigue pas
        var url = b0 + "/p/" + pg.p;
        try { window.top.location.href = url; }
        catch (e) { window.open(url, "_blank"); }
      });
    });
    bar.appendChild(b);
  });

  // Pré-chargement : l'URL du document est connue AVANT le premier clic
  // (la navigation reste dans le délai d'activation utilisateur du navigateur)
  // et la pastille d'état (vert/rouge) reflète le résultat.
  getBase();
})();
</script>
</body>
</html>
