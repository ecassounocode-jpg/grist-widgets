<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sélecteur d'état de liquidation</title>
<!--
  Widget Grist : sélecteur « Par état de liquidation » avec bouton « Tous les états ».
  Ville de Roubaix — DSI — Suivi budget & factures CNF

  - Source : Factures_summary_Etat_Liquidation, accès « Lire la table sélectionnée ».
  - Ce widget PILOTE la liste « Toutes les factures » : dans la config de la liste,
    « Sélectionner par » = ce widget (fait via l'API : linkSrcSectionRef).
  - « Tous les états » = setSelectedRows(null) → aucun filtre.
  - Le camembert de la Synthèse dépose l'état cliqué dans localStorage (même origine
    GitHub Pages) ; à l'ouverture, ce widget applique ce filtre puis efface la clé.
-->
<script src="grist-plugin-api.js"></script>
<script>
  if (!window.grist) {
    document.write('<script src="https://docs.getgrist.com/grist-plugin-api.js"><\/script>');
  }
</script>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", -apple-system, Roboto, Arial, sans-serif; color: #252423; background: #fff; }
  #list { height: 100%; overflow-y: auto; padding: 4px 6px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; margin: 2px 0;
    border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
  .row:hover { background: #F3F2F1; }
  .row.active { background: #EFF6FC; border-color: #118DFF; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .lb { flex: 1 1 auto; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.all .lb { font-weight: 600; }
  .ct { font-size: 12px; color: #605E5C; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ct b { color: #252423; font-weight: 600; }
</style>
</head>
<body>
<div id="list"></div>
<script>
(function () {
  "use strict";
  var LS_KEY = "dsiEtatFiltre";
  var COLORS = {
    "Mandatée": "#EF9A4D",
    "En attente de rapprochement": "#3B82F6",
    "Mandatée (+annulation)": "#2E9E68",
    "Rapprochée aux engagements": "#E15241",
    "Annulée": "#9CA3AF"
  };
  var euro = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  var DATA = [], activeId = null; // null = tous

  function apply(id) {
    activeId = id;
    try { grist.setSelectedRows(id == null ? null : [id]); } catch (e) {}
    render();
  }

  function render() {
    var total = DATA.reduce(function (s, r) { return s + (r.count || 0); }, 0);
    var somme = DATA.reduce(function (s, r) { return s + (r.Montant_TTC || 0); }, 0);
    var list = document.getElementById("list");
    var h = '<div class="row all' + (activeId == null ? ' active' : '') + '" data-id="">' +
            '<span class="dot" style="background:#252423"></span>' +
            '<span class="lb">Tous les états</span>' +
            '<span class="ct"><b>' + total + '</b> · ' + euro.format(somme) + " €</span></div>";
    var rows = DATA.slice().sort(function (a, b) { return (b.count||0) - (a.count||0); });
    h += rows.map(function (r) {
      var k = String(r.Etat_Liquidation || "(sans état)");
      return '<div class="row' + (activeId === r.id ? ' active' : '') + '" data-id="' + r.id + '">' +
        '<span class="dot" style="background:' + (COLORS[k] || "#744EC2") + '"></span>' +
        '<span class="lb">' + k.replace(/</g, "&lt;") + '</span>' +
        '<span class="ct"><b>' + (r.count || 0) + '</b> · ' + euro.format(r.Montant_TTC || 0) + " €</span></div>";
    }).join("");
    list.innerHTML = h;
    Array.prototype.forEach.call(list.children, function (el) {
      el.onclick = function () {
        var v = el.getAttribute("data-id");
        apply(v === "" ? null : parseInt(v, 10));
      };
    });
  }

  function consumePending() {
    // filtre déposé par le camembert de la Synthèse (même origine GitHub Pages)
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var msg = JSON.parse(raw);
      localStorage.removeItem(LS_KEY);
      if (!msg || (Date.now() - (msg.ts || 0)) > 20000) return; // périmé
      var hit = DATA.find(function (r) { return String(r.Etat_Liquidation || "") === msg.etat; });
      if (hit) apply(hit.id);
    } catch (e) {}
  }

  var first = true;
  function start() {
    if (!window.grist) { document.getElementById("list").textContent = "grist-plugin-api.js introuvable."; return; }
    grist.ready({ requiredAccess: "read table", allowSelectBy: true });
    grist.onRecords(function (records) {
      DATA = records || [];
      if (first) { first = false; render(); consumePending(); }
      else render();
    });
    window.addEventListener("storage", function (e) { if (e.key === LS_KEY) consumePending(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</body>
</html>
